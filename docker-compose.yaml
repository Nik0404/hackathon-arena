services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    volumes:
      - open-webui:/app/backend/data
    environment:
      - 'ENABLE_OLLAMA_API=False'
      - 'ENABLE_OPENAI_API=True'
      - 'OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL-https://api.gpt.mws.ru/v1}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY-}'
      - 'RAG_OPENAI_API_BASE_URL=${RAG_OPENAI_API_BASE_URL-https://api.gpt.mws.ru/v1}'
      - 'RAG_OPENAI_API_KEY=${RAG_OPENAI_API_KEY-${OPENAI_API_KEY-}}'
      - 'AUDIO_STT_OPENAI_API_BASE_URL=${AUDIO_STT_OPENAI_API_BASE_URL-https://api.gpt.mws.ru/v1}'
      - 'AUDIO_STT_OPENAI_API_KEY=${AUDIO_STT_OPENAI_API_KEY-${OPENAI_API_KEY-}}'
      - 'IMAGES_OPENAI_API_BASE_URL=${IMAGES_OPENAI_API_BASE_URL-https://api.gpt.mws.ru/v1}'
      - 'IMAGES_OPENAI_API_KEY=${IMAGES_OPENAI_API_KEY-${OPENAI_API_KEY-}}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
